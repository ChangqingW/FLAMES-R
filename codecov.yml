# CI uploads coverage from the `devel` and `main` branches
# see .github/workflows/check-bioc.yml
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, files"
  behavior: default
  require_changes: false

# Exclude generated bindings, plotting-only code, and thin wrappers around
# external tools / python (basilisk, binary downloads) that cannot be
# meaningfully unit-tested
ignore:
  - "R/RcppExports.R"
  - "src/RcppExports.cpp"
  - "R/sc_annotate_plots.R"
  - "R/basilisk.R"
  - "R/binaries.R"
  # not our code
  - "src/utility/edlib-1.2.7/**"
  - "src/submodule/**"
